[project]
name = "vtop-pilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lokesh-Ramineni", email = "lokesh.ramineni1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "imap-tools>=1.15.0",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.scripts]
vtop-pilot = "vtop_pilot:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
